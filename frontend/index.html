<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CoffeeNpcAgent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --wechat-green:#07c160;--wechat-green-dark:#06ad56;
  --bg:#ededed;--chat-bg:#f0f0f0;--surface:#fff;--card:#fff;
  --border:#e0e0e0;--border-light:#ececec;
  --text:#333;--text2:#888;--text3:#b2b2b2;
  --bubble-self:#95ec69;--bubble-self-text:#000;
  --bubble-other:#fff;--bubble-other-text:#000;
  --header-bg:#ededed;--header-text:#000;
  --input-bg:#f7f7f7;--input-border:#e0e0e0;
  --radius:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px}
button{cursor:pointer;border:none;border-radius:var(--radius);padding:8px 16px;font-size:14px;transition:.15s}
input,select,textarea{border:1px solid var(--input-border);border-radius:var(--radius);padding:8px 12px;background:#fff;color:var(--text);font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--wechat-green)}

/* ─── layout ─── */
.app{display:grid;grid-template-columns:260px 1fr 300px;grid-template-rows:auto 1fr;height:100vh;gap:0}

/* ─── header ─── */
.header{grid-column:1/-1;background:var(--header-bg);padding:10px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border)}
.header h1{font-size:17px;font-weight:600;color:var(--text)}
.header .status{font-size:11px;padding:2px 8px;border-radius:10px;background:#e0e0e0;color:var(--text2)}
.header .status.ok{background:#d4f5d4;color:var(--wechat-green-dark)}

/* ─── left panel (contacts style) ─── */
.left{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.left-section{padding:14px 16px;border-bottom:1px solid var(--border-light)}
.left-section:last-child{border-bottom:none}
.section-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px}
.field{margin-bottom:8px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:3px}
.field input,.field select{width:100%;background:var(--input-bg);border-color:var(--border-light)}
.btn{width:100%;background:var(--wechat-green);color:#fff;font-weight:500;border-radius:4px}
.btn:hover{background:var(--wechat-green-dark)}
.btn.primary{background:var(--wechat-green)}
.btn.primary:hover{background:var(--wechat-green-dark)}
.btn.sm{padding:6px 12px;font-size:12px;width:auto;background:var(--wechat-green);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--input-bg);color:var(--text2)}
.btn.ghost:hover{background:var(--border-light);color:var(--text)}

/* ─── npc list (contact list) ─── */
.npc-list{display:flex;flex-direction:column}
.npc-card{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border-light);transition:background .1s}
.npc-card:hover{background:#f5f5f5}
.npc-card.active{background:#d9d9d9}
.npc-avatar{width:40px;height:40px;border-radius:4px;background:var(--wechat-green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0}
.npc-avatar.staff{background:#576b95}
.npc-avatar.customer{background:#fa9d3b}
.npc-avatar.passerby{background:#a0a0a0}
.npc-info-wrap{flex:1;min-width:0}
.npc-info-wrap .name{font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npc-info-wrap .role{font-size:12px;color:var(--text2);margin-top:1px}
.npc-info-wrap .emotion{font-size:11px;color:var(--text3);margin-top:1px}

/* ─── center: chat area (wechat conversation) ─── */
.center{display:flex;flex-direction:column;background:var(--chat-bg);min-height:0;overflow:hidden}
.chat-header{padding:12px 20px;background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.chat-header .npc-name{font-weight:600;font-size:16px;color:var(--text)}
.chat-header .npc-info{font-size:12px;color:var(--text2)}
.messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}

/* message bubbles */
.msg{max-width:70%;padding:10px 14px;font-size:15px;line-height:1.5;position:relative;word-break:break-word}
.msg.player{align-self:flex-end;background:var(--bubble-self);color:var(--bubble-self-text);border-radius:4px 0 4px 4px}
.msg.player::after{content:'';position:absolute;right:-6px;top:10px;border:6px solid transparent;border-left-color:var(--bubble-self);border-right:0}
.msg.npc{align-self:flex-start;background:var(--bubble-other);color:var(--bubble-other-text);border-radius:0 4px 4px 4px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.msg.npc::after{content:'';position:absolute;left:-6px;top:10px;border:6px solid transparent;border-right-color:var(--bubble-other);border-left:0}
.msg.npc .meta{font-size:11px;color:var(--text2);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.msg.npc .meta span{background:var(--chat-bg);padding:2px 8px;border-radius:10px;font-size:10px}
.msg.system{align-self:center;background:transparent;color:var(--text3);font-size:12px;padding:4px 12px;max-width:90%}
.msg.history{opacity:.6}
.history-divider{align-self:center;display:flex;align-items:center;gap:8px;width:60%;margin:4px 0;color:var(--text3);font-size:11px}
.history-divider::before,.history-divider::after{content:'';flex:1;border-top:1px solid var(--border)}

/* typing indicator */
.typing{align-self:flex-start;color:var(--text2);font-size:13px;padding:8px 14px}
.typing::after{content:'...';animation:dots 1s steps(3) infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}

/* chat input bar */
.chat-input{padding:10px 16px;background:var(--input-bg);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
.chat-input input{flex:1;background:#fff;border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-size:15px}
.chat-input button{background:var(--wechat-green);color:#fff;font-weight:500;border-radius:4px;min-width:64px;padding:8px 16px;font-size:15px}
.chat-input button:hover{background:var(--wechat-green-dark)}

/* ─── right panel (detail drawer) ─── */
.right{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:0;font-size:13px}
.tab-bar{display:flex;background:var(--header-bg);border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 0;cursor:pointer;font-size:13px;color:var(--text2);text-align:center;border-bottom:2px solid transparent;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--wechat-green);border-bottom-color:var(--wechat-green)}
.tab-content{display:none;padding:14px 16px}
.tab-content.active{display:block}
.data-block{background:var(--input-bg);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.data-block .key{color:var(--text2);font-weight:600;font-size:12px}
.data-block .val{color:var(--text);word-break:break-all;margin-top:2px}
.data-block .val pre{font-size:12px;white-space:pre-wrap;margin:0;font-family:Menlo,Consolas,monospace}
.rel-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rel-bar .label{width:40px;text-align:right;font-size:12px;color:var(--text2)}
.rel-bar .bar{flex:1;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.rel-bar .bar .fill{height:100%;border-radius:3px;transition:width .3s}
.rel-bar .num{width:30px;font-size:12px;color:var(--text2)}
.tool-item{background:var(--input-bg);border-radius:var(--radius);padding:8px 12px;margin-bottom:4px;font-size:12px;cursor:pointer;transition:.1s}
.tool-item:hover{background:var(--border-light)}
.tool-item .tname{color:var(--wechat-green-dark);font-weight:600}
.tool-item .tdesc{color:var(--text2);margin-top:2px}
.know-item{background:var(--input-bg);border-radius:var(--radius);padding:8px 12px;margin-bottom:4px;font-size:12px}
.know-item .ktitle{color:var(--wechat-green-dark);font-weight:600}
.know-item .kcat{color:var(--text2);font-size:11px}

/* ─── empty state ─── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:10px}
.empty-state .icon{font-size:52px;opacity:.25}
.empty-state .text{font-size:14px}

/* ─── scrollbar (subtle) ─── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c0c0c0;border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#a0a0a0}
</style>
</head>
<body>
<div class="app">
  <!-- header -->
  <div class="header">
    <h1>CoffeeNpcAgent</h1>
    <div class="status" id="connStatus">未连接</div>
    <div style="flex:1"></div>
    <span style="font-size:12px;color:var(--text2)">API:</span>
    <input id="apiBase" value="http://localhost:8000" style="width:200px;font-size:12px;padding:4px 8px"/>
  </div>

  <!-- left: contacts panel -->
  <div class="left">
    <div class="left-section">
      <div class="section-title">场景入口</div>
      <div class="field">
        <label>玩家 ID</label>
        <input id="playerId" value="p001" placeholder="player_id"/>
      </div>
      <div class="field">
        <label>昵称</label>
        <input id="nickname" value="测试玩家" placeholder="nickname"/>
      </div>
      <div class="field">
        <label>会话 ID (可选)</label>
        <input id="sessionId" placeholder="留空自动生成"/>
      </div>
      <button class="btn primary" onclick="enterMorningCafe()">进入上午咖啡厅</button>
    </div>

    <div class="left-section" style="flex:1;overflow-y:auto;padding:0">
      <div style="padding:10px 16px 6px"><div class="section-title">NPC 列表</div></div>
      <div class="npc-list" id="npcList">
        <div style="color:var(--text3);font-size:12px;padding:12px 16px">加载中...</div>
      </div>
      <div style="padding:8px 16px">
        <button class="btn ghost" onclick="loadNpcList()" style="font-size:12px">刷新列表</button>
      </div>
    </div>

    <div class="left-section">
      <button class="btn ghost" onclick="refreshSnapshot()" style="margin-bottom:4px;font-size:12px">刷新场景快照</button>
      <button class="btn ghost" onclick="checkHealth()" style="margin-bottom:4px;font-size:12px">健康检查</button>
      <button class="btn ghost" onclick="loadTools()" style="font-size:12px">查看工具列表</button>
    </div>
  </div>

  <!-- center: chat -->
  <div class="center">
    <div class="chat-header">
      <span class="npc-name" id="chatNpcName">CoffeeNpcAgent</span>
      <span class="npc-info" id="chatNpcInfo">选择一位NPC开始对话</span>
      <div style="flex:1"></div>
      <button class="btn sm" onclick="loadHistoryMessages()" id="btnLoadHistory" style="display:none;font-size:11px;padding:4px 10px">历史记录</button>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state">
        <div class="icon">&#9749;</div>
        <div class="text">欢迎来到咖啡厅</div>
        <div class="text" style="font-size:12px">先在左侧进入场景，然后选择一位NPC聊天</div>
      </div>
    </div>
    <div class="chat-input">
      <input id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- right: detail drawer -->
  <div class="right">
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('world')">世界</div>
      <div class="tab" onclick="switchTab('npc')">NPC</div>
      <div class="tab" onclick="switchTab('player')">玩家</div>
      <div class="tab" onclick="switchTab('tools')">工具</div>
      <div class="tab" onclick="switchTab('coffee')">咖啡</div>
    </div>

    <div class="tab-content active" id="tab-world">
      <div id="worldContent" style="color:var(--text3);font-size:12px">暂无数据</div>
    </div>
    <div class="tab-content" id="tab-npc">
      <div id="npcContent" style="color:var(--text3);font-size:12px">选择NPC后查看详情</div>
    </div>
    <div class="tab-content" id="tab-player">
      <div id="playerContent" style="color:var(--text3);font-size:12px">进入场景后查看玩家信息</div>
    </div>
    <div class="tab-content" id="tab-tools">
      <div id="toolsContent" style="color:var(--text3);font-size:12px">点击"查看工具列表"加载</div>
    </div>
    <div class="tab-content" id="tab-coffee">
      <div class="field" style="margin-bottom:8px">
        <input id="coffeeQuery" placeholder="搜索咖啡知识..."/>
      </div>
      <div class="field" style="margin-bottom:8px">
        <select id="coffeeCategory">
          <option value="">全部分类</option>
          <option value="bean">bean</option>
          <option value="brew">brew</option>
          <option value="milk">milk</option>
          <option value="flavor">flavor</option>
          <option value="menu">menu</option>
        </select>
      </div>
      <button class="btn sm" onclick="searchCoffee()" style="margin-bottom:10px">搜索</button>
      <div id="coffeeContent"></div>
    </div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────
const state = {
  currentSessionId: null,
  currentPlayerId: null,
  currentNpcId: null,
  npcs: [],
  sending: false,
};

// ─── Helpers ──────────────────────────────────────────────
const $ = id => document.getElementById(id);
const api = () => $('apiBase').value.replace(/\/+$/, '');

async function request(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(api() + path, opts);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || JSON.stringify(json.data) || '请求失败');
  return json.data;
}

function dig(obj, ...paths) {
  for (const p of paths) {
    let cur = obj;
    for (const key of p.split('.')) {
      if (cur == null || typeof cur !== 'object') { cur = undefined; break; }
      cur = cur[key];
    }
    if (cur != null) return cur;
  }
  return undefined;
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function getAvatarClass(npc) {
  const t = String(npc.npc_type || '').toLowerCase();
  if (t === 'staff') return 'staff';
  if (t === 'customer' || t === 'fixed_customer') return 'customer';
  return 'passerby';
}

function getAvatarLetter(npc) {
  return (npc.name || npc.npc_id || '?').charAt(0);
}

// ─── Connection ───────────────────────────────────────────
async function checkHealth() {
  try {
    const data = await request('GET', '/health');
    $('connStatus').textContent = '已连接';
    $('connStatus').className = 'status ok';
    addSystemMessage(`服务正常 - ${data.service} | 工具数: ${data.available_tools?.length ?? '?'}`);
  } catch (e) {
    $('connStatus').textContent = '连接失败';
    $('connStatus').className = 'status';
    addSystemMessage('连接失败: ' + e.message);
  }
}

// ─── Load NPC list ────────────────────────────────────────
async function loadNpcList() {
  try {
    const data = await request('GET', '/npcs');
    const npcs = dig(data, 'npcs', 'result.npcs') || [];
    if (Array.isArray(npcs) && npcs.length) {
      state.npcs = npcs;
      renderNpcList();
      return;
    }
  } catch (e) {}
  try {
    const data = await request('POST', '/tools/invoke', {
      tool_name: 'get_npc_state',
      arguments: { npc_id: '__list_all__' },
    });
    const npcs = dig(data, 'npcs', 'result.npcs') || [];
    if (Array.isArray(npcs)) { state.npcs = npcs; renderNpcList(); }
  } catch (e) {}
}

// ─── Scene ────────────────────────────────────────────────
async function enterMorningCafe() {
  const playerId = $('playerId').value.trim();
  const nickname = $('nickname').value.trim() || undefined;
  const sessionId = $('sessionId').value.trim() || undefined;
  if (!playerId) return alert('请输入玩家ID');

  try {
    const data = await request('POST', '/scene/morning', {
      player_id: playerId, nickname, session_id: sessionId,
    });
    const session = dig(data, 'result.session', 'session');
    state.currentSessionId = session?.session_id || data.session_id || sessionId;
    state.currentPlayerId = playerId;
    const npcs = dig(data, 'result.npcs', 'npcs') || [];
    if (Array.isArray(npcs) && npcs.length) state.npcs = npcs;
    renderNpcList();
    addSystemMessage(`已进入上午咖啡厅 - 会话: ${state.currentSessionId}`);
    if (state.currentSessionId) $('sessionId').value = state.currentSessionId;
    await refreshSnapshot();
    await loadPlayerContext();
  } catch (e) {
    addSystemMessage('进入场景失败: ' + e.message);
  }
}

function renderNpcList() {
  const container = $('npcList');
  if (!state.npcs.length) {
    container.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:12px 16px">暂无NPC，点击下方按钮刷新</div>';
    return;
  }
  container.innerHTML = state.npcs.map(n => `
    <div class="npc-card ${state.currentNpcId === n.npc_id ? 'active' : ''}"
         onclick="selectNpc('${esc(n.npc_id)}')">
      <div class="npc-avatar ${getAvatarClass(n)}">${esc(getAvatarLetter(n))}</div>
      <div class="npc-info-wrap">
        <div class="name">${esc(n.name || n.npc_id)}</div>
        <div class="role">${esc(n.role || '')}</div>
        <div class="emotion">${esc(n.current_emotion || '')} ${esc(n.current_location || '')}</div>
      </div>
    </div>
  `).join('');
}

async function selectNpc(npcId) {
  if (!state.currentSessionId) return alert('请先进入场景');
  try {
    await request('POST', `/sessions/${state.currentSessionId}/select-npc`, { npc_id: npcId });
    state.currentNpcId = npcId;
    const npc = state.npcs.find(n => n.npc_id === npcId);
    renderNpcList();
    $('chatNpcName').textContent = npc?.name || npcId;
    $('chatNpcInfo').textContent = `${npc?.role || ''} · ${npc?.current_emotion || ''}`;
    $('btnLoadHistory').style.display = '';
    $('messages').innerHTML = '';
    await loadHistoryMessages();
    addSystemMessage(`已选择 NPC: ${npc?.name || npcId}`);
    await loadNpcState(npcId);
    await loadRelationship(state.currentPlayerId, npcId);
    switchTab('npc');
  } catch (e) {
    addSystemMessage('选择NPC失败: ' + e.message);
  }
}

// ─── Chat ─────────────────────────────────────────────────

async function loadHistoryMessages() {
  if (!state.currentPlayerId || !state.currentNpcId) return;
  const container = $('messages');
  try {
    const path = `/dialogue/history?player_id=${encodeURIComponent(state.currentPlayerId)}&npc_id=${encodeURIComponent(state.currentNpcId)}&limit=100`;
    const data = await request('GET', path);
    const messages = data.messages || [];
    if (!Array.isArray(messages) || messages.length === 0) return;
    container.innerHTML = '';
    const divider = document.createElement('div');
    divider.className = 'history-divider';
    divider.textContent = '历史对话记录';
    container.appendChild(divider);
    for (const msg of messages) {
      const role = String(msg.role || '').toLowerCase();
      const content = msg.content || '';
      if (!content) continue;
      if (role === 'player') {
        addChatMessage('player', content, {}, true);
      } else if (role === 'npc') {
        const meta = {
          action: msg.action ? String(msg.action) : '',
          emotion: msg.emotion ? String(msg.emotion) : '',
          intent: msg.intent ? String(msg.intent) : '',
        };
        addChatMessage('npc', content, meta, true);
      }
    }
    const endDivider = document.createElement('div');
    endDivider.className = 'history-divider';
    endDivider.textContent = '以上为历史记录';
    container.appendChild(endDivider);
    container.scrollTop = container.scrollHeight;
  } catch (e) {
    console.warn('加载历史记录失败:', e.message);
  }
}

function addSystemMessage(text) {
  const container = $('messages');
  if (container.querySelector('.empty-state')) container.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addChatMessage(role, text, meta = {}, isHistory = false) {
  const container = $('messages');
  if (container.querySelector('.empty-state')) container.innerHTML = '';
  const div = document.createElement('div');
  div.className = `msg ${role}${isHistory ? ' history' : ''}`;
  if (role === 'npc') {
    const metaHtml = [
      meta.action ? `<span>${esc(meta.action)}</span>` : '',
      meta.emotion ? `<span>${esc(meta.emotion)}</span>` : '',
      meta.intent ? `<span>${esc(meta.intent)}</span>` : '',
      meta.elapsed ? `<span style="color:var(--wechat-green)">${esc(meta.elapsed)}s</span>` : '',
    ].filter(Boolean).join('');
    div.innerHTML = `${esc(text)}${metaHtml ? `<div class="meta">${metaHtml}</div>` : ''}`;
  } else {
    div.textContent = text;
  }
  container.appendChild(div);
  if (!isHistory) container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = $('messages');
  if (container.querySelector('.empty-state')) container.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.textContent = '对方正在输入';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const el = $('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text || state.sending) return;
  if (!state.currentSessionId || !state.currentNpcId) return alert('请先进入场景并选择NPC');
  state.sending = true;
  input.value = '';
  addChatMessage('player', text);
  showTyping();
  const t0 = Date.now();
  try {
    const data = await request('POST', '/dialogue/messages', {
      player_id: state.currentPlayerId,
      session_id: state.currentSessionId,
      message: text,
      npc_id: state.currentNpcId,
    });
    hideTyping();
    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);

    // npc_reply is the full write_npc_reply tool result, actual text is nested
    const reply = dig(data, 'npc_reply.message.content', 'npc_reply.content',
                       'decision.line', 'reply', 'content', 'message') || '';
    // Normalize: if reply is still an object, try its .content or stringify
    const replyText = typeof reply === 'object' ? (reply.content || reply.line || JSON.stringify(reply)) : String(reply);

    const action = dig(data, 'decision.action', 'action') || '';
    const emotion = dig(data, 'decision.emotion', 'emotion') || '';
    const intent = dig(data, 'decision.intent', 'intent') || '';
    const meta = {
      action: typeof action === 'object' ? JSON.stringify(action) : String(action),
      emotion: typeof emotion === 'object' ? JSON.stringify(emotion) : String(emotion),
      intent: typeof intent === 'object' ? JSON.stringify(intent) : String(intent),
      elapsed,
    };
    addChatMessage('npc', replyText, meta);
    loadNpcState(state.currentNpcId);
    loadRelationship(state.currentPlayerId, state.currentNpcId);
    loadPlayerContext();
  } catch (e) {
    hideTyping();
    addSystemMessage('发送失败: ' + e.message);
  } finally {
    state.sending = false;
  }
}

// ─── Snapshot / World ─────────────────────────────────────
async function refreshSnapshot() {
  if (!state.currentSessionId) return;
  try {
    const data = await request('GET', `/sessions/${state.currentSessionId}/snapshot`);
    const ws = dig(data, 'world_state.world_state', 'world_state') || {};
    const evtData = dig(data, 'events') || {};
    const events = evtData.events || (Array.isArray(evtData) ? evtData : []);
    renderWorldState(ws, events);
    if (data.selected_npc_id && !state.currentNpcId) {
      state.currentNpcId = data.selected_npc_id;
      const npc = state.npcs.find(n => n.npc_id === data.selected_npc_id);
      if (npc) {
        $('chatNpcName').textContent = npc.name;
        $('chatNpcInfo').textContent = `${npc.role} · ${npc.current_emotion}`;
      }
      renderNpcList();
    }
    const selNpc = dig(data, 'selected_npc.npc', 'selected_npc');
    if (selNpc && state.currentNpcId) {
      const idx = state.npcs.findIndex(n => n.npc_id === state.currentNpcId);
      if (idx >= 0) { state.npcs[idx] = { ...state.npcs[idx], ...selNpc }; renderNpcList(); }
    }
  } catch (e) {
    $('worldContent').innerHTML = `<span style="color:#fa5151">加载失败: ${esc(e.message)}</span>`;
  }
}

function renderWorldState(ws, events) {
  const html = `
    <div class="data-block"><div class="key">时间段</div><div class="val">${esc(ws.time_period || '-')}</div></div>
    <div class="data-block"><div class="key">天气</div><div class="val">${esc(ws.weather || '-')}</div></div>
    <div class="data-block"><div class="key">客流量</div><div class="val">${esc(ws.customer_flow || '-')}</div></div>
    <div class="data-block"><div class="key">背景音乐</div><div class="val">${esc(ws.background_music || '-')}</div></div>
    <div class="data-block"><div class="key">库存</div><div class="val"><pre>${JSON.stringify(ws.inventory || {}, null, 2)}</pre></div></div>
    <div class="data-block"><div class="key">今日菜单</div><div class="val"><pre>${JSON.stringify(ws.today_menu || [], null, 2)}</pre></div></div>
    <div class="data-block"><div class="key">座位占用</div><div class="val"><pre>${JSON.stringify(ws.seat_occupancy || {}, null, 2)}</pre></div></div>
    <div class="data-block"><div class="key">事件 (${events.length})</div><div class="val">${events.map(e => esc(e.title || e.event_id || JSON.stringify(e))).join('<br/>') || '无'}</div></div>
  `;
  $('worldContent').innerHTML = html;
}

// ─── NPC State ────────────────────────────────────────────

    renderNpcState(npc);
  } catch (e) {
    $('npcContent').innerHTML = `<span style="color:#fa5151">${esc(e.message)}</span>`;
  }
}

    <div class="data-block"><div class="key">名称</div><div class="val">${esc(n.name || '')}</div></div>
    <div class="data-block"><div class="key">类型 / 角色</div><div class="val">${esc(n.npc_type || '')} / ${esc(n.role || '')}</div></div>
    <div class="data-block"><div class="key">性格</div><div class="val">${esc(n.personality || '-')}</div></div>
    <div class="data-block"><div class="key">说话风格</div><div class="val">${esc(n.speaking_style || '-')}</div></div>
    <div class="data-block"><div class="key">当前情绪</div><div class="val">${esc(n.current_emotion || '-')}</div></div>
    <div class="data-block"><div class="key">当前位置</div><div class="val">${esc(n.current_location || '-')}</div></div>
    <div class="data-block"><div class="key">MBTI</div><div class="val">${esc(n.mbti || '-')}</div></div>
    <div class="data-block"><div class="key">咖啡偏好</div><div class="val"><pre>${JSON.stringify(n.coffee_preferences || {}, null, 2)}</pre></div></div>
    <div class="data-block"><div class="key">爱好</div><div class="val">${(n.hobbies || []).map(h => esc(h)).join(', ') || '-'}</div></div>

// ─── Relationship ─────────────────────────────────────────
async function loadRelationship(playerId, npcId) {
  if (!playerId || !npcId) return;
  try {
    const data = await request('GET', `/players/${playerId}/relationships/${npcId}`);
    const rel = dig(data, 'relationship') || data;
    renderRelationship(rel);
  } catch (e) {}
}

function renderRelationship(r) {
  const dims = [
    { key: 'trust', label: '信任', color: '#07c160' },
    { key: 'familiarity', label: '熟悉', color: '#576b95' },
    { key: 'fondness', label: '喜欢', color: '#fa5151' },
    { key: 'dislike', label: '厌恶', color: '#8e44ad' },
    { key: 'stress', label: '压力', color: '#fa9d3b' },
  ];
  const html = `<div style="margin-bottom:10px;font-weight:600;color:var(--text);font-size:13px">关系五维</div>` +
    dims.map(d => {
      const v = r[d.key] ?? 0;
      const pct = Math.min(Math.max(v, 0), 100);
      return `<div class="rel-bar">
        <div class="label">${d.label}</div>
        <div class="bar"><div class="fill" style="width:${pct}%;background:${d.color}"></div></div>
        <div class="num">${v}</div>
      </div>`;
    }).join('') +
    `<div class="data-block" style="margin-top:8px"><div class="key">最后互动</div><div class="val">${r.last_interacted_at ? formatTime(r.last_interacted_at) : '-'}</div></div>`;
  $('npcContent').innerHTML += html;
}

// ─── Player ───────────────────────────────────────────────
async function loadPlayerContext() {
  if (!state.currentPlayerId) return;
  try {
    const data = await request('GET', `/players/${state.currentPlayerId}/context${state.currentNpcId ? '?npc_id=' + encodeURIComponent(state.currentNpcId) : ''}`);
    const player = dig(data, 'profile.player', 'profile', 'result.player', 'player') || data;
    renderPlayerContext(player);
  } catch (e) {
    $('playerContent').innerHTML = `<span style="color:#fa5151">${esc(e.message)}</span>`;
  }
}

function renderPlayerContext(p) {
  const html = `
    <div class="data-block"><div class="key">玩家 ID</div><div class="val">${esc(p.player_id || '')}</div></div>
    <div class="data-block"><div class="key">昵称</div><div class="val">${esc(p.nickname || '-')}</div></div>
    <div class="data-block"><div class="key">口味偏好</div><div class="val"><pre>${JSON.stringify(p.taste_preferences || {}, null, 2)}</pre></div></div>
    <div class="data-block"><div class="key">消费习惯</div><div class="val"><pre>${JSON.stringify(p.consumption_habits || {}, null, 2)}</pre></div></div>
    <div class="data-block"><div class="key">性格倾向</div><div class="val"><pre>${JSON.stringify(p.personality_tendency || {}, null, 2)}</pre></div></div>

// ─── Tools ────────────────────────────────────────────────
async function loadTools() {
  try {
    const data = await request('GET', '/tools');
    const tools = data.tools || [];
    $('toolsContent').innerHTML = tools.map(t =>
      typeof t === 'string'
        ? `<div class="tool-item" onclick="invokeTool('${esc(t)}')"><div class="tname">${esc(t)}</div></div>`
        : `<div class="tool-item" onclick="invokeTool('${esc(t.name || '')}')"><div class="tname">${esc(t.name || '')}</div><div class="tdesc">${esc(t.description || '')}</div></div>`
    ).join('') || '<span style="color:var(--text3)">无可用工具</span>';
  } catch (e) {
    $('toolsContent').innerHTML = `<span style="color:#fa5151">${esc(e.message)}</span>`;
  }
}

async function invokeTool(name) {
  const argsStr = prompt(`调用工具: ${name}\n请输入 JSON 参数 (可为空):`, '{}');
  if (argsStr === null) return;
  let args = {};
  try { args = JSON.parse(argsStr || '{}'); } catch { return alert('JSON 格式错误'); }
  try {
    const data = await request('POST', '/tools/invoke', { tool_name: name, arguments: args });
    addSystemMessage(`工具 ${name} 返回: ${JSON.stringify(data).slice(0, 300)}`);
  } catch (e) {
    addSystemMessage(`工具 ${name} 失败: ${e.message}`);
  }
}

// ─── Coffee Knowledge ─────────────────────────────────────
async function searchCoffee() {
  const query = $('coffeeQuery').value.trim();
  const category = $('coffeeCategory').value;
  try {
    let path = `/coffee-knowledge?limit=20`;
    if (category) path += `&category=${encodeURIComponent(category)}`;
    const data = await request('GET', path);
    const items = dig(data, 'knowledge') || data.items || data.records || (Array.isArray(data) ? data : []);
    $('coffeeContent').innerHTML = items.length
      ? items.map(k => `<div class="know-item"><div class="ktitle">${esc(k.title || k.name || k.knowledge_id || '')}</div><div class="kcat">${esc(k.category || '')}</div><div style="margin-top:4px">${esc(k.content || k.description || '')}</div></div>`).join('')
      : '<span style="color:var(--text3)">无结果</span>';
  } catch (e) {
    $('coffeeContent').innerHTML = `<span style="color:#fa5151">${esc(e.message)}</span>`;
  }
}

// ─── Tabs ─────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.includes({world:'世界',npc:'NPC',player:'玩家',tools:'工具',coffee:'咖啡'}[name])));
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.toggle('active', tc.id === `tab-${name}`));
}
