<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameNpcFrame</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:#f4f6f8;
  color:#1f2933;
  height:100vh;
  overflow:hidden;
}
button,input,textarea{font:inherit}
button{border:0;border-radius:6px;padding:8px 12px;background:#2563eb;color:#fff;cursor:pointer}
button.secondary{background:#475569}
button.success{background:#15803d}
button.danger{background:#b91c1c}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea{
  border:1px solid #cbd5e1;
  border-radius:6px;
  padding:8px;
  background:#fff;
  color:#1f2933;
}
.app{
  display:grid;
  grid-template-columns:300px 1fr 340px;
  grid-template-rows:52px 1fr;
  height:100vh;
}
.top{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px;
  background:#111827;
  color:#f8fafc;
}
.top h1{font-size:18px;margin:0;font-weight:650}
.top input{width:240px;padding:5px 8px}
.status{font-size:12px;color:#cbd5e1}
.panel{overflow:auto;background:#fff;border-right:1px solid #d8dee8}
.panel.right{border-left:1px solid #d8dee8;border-right:0}
.section{padding:14px;border-bottom:1px solid #e5e9f0}
.section h2{font-size:14px;margin:0 0 10px;color:#334155}
.field{display:grid;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:#64748b}
.field input,.field textarea{width:100%}
.upload-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}
.result{font-size:12px;line-height:1.5;color:#475569;white-space:pre-wrap}
.npc-list{display:grid;gap:6px}
.npc-item{padding:10px;border:1px solid #d8dee8;border-radius:6px;background:#f8fafc;cursor:pointer}
.npc-item.active{border-color:#2563eb;background:#eff6ff}
.npc-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.npc-row button{padding:5px 8px;font-size:12px;white-space:nowrap}
.npc-name{font-weight:650}
.npc-role{font-size:12px;color:#64748b;margin-top:2px}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:#eef2f7}
.chat-head{
  height:48px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 16px;
  background:#fff;
  border-bottom:1px solid #d8dee8;
}
.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.msg{max-width:72%;padding:10px 12px;border-radius:8px;line-height:1.5;white-space:pre-wrap}
.msg.player{align-self:flex-end;background:#dcfce7;color:#14532d}
.msg.npc{align-self:flex-start;background:#fff;color:#1f2933;border:1px solid #d8dee8}
.msg.system{align-self:center;max-width:90%;background:transparent;color:#64748b;font-size:12px}
.msg-meta{margin-top:5px;font-size:11px;color:#64748b}
.chat-input{display:flex;gap:10px;padding:12px;background:#fff;border-top:1px solid #d8dee8}
.chat-input input{flex:1}
.tabs{display:flex;border-bottom:1px solid #d8dee8;background:#f8fafc}
.tab{flex:1;padding:10px;border-radius:0;background:transparent;color:#475569}
.tab.active{background:#fff;color:#2563eb;border-bottom:2px solid #2563eb}
.tab-content{display:none;padding:14px}
.tab-content.active{display:block}
.data{background:#f8fafc;border:1px solid #d8dee8;border-radius:6px;padding:10px;margin-bottom:8px}
.data b{display:block;font-size:12px;color:#64748b;margin-bottom:4px}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font-size:12px}
@media (max-width:1100px){
  .app{grid-template-columns:280px 1fr;grid-template-rows:52px 1fr 320px}
  .panel.right{grid-column:1/-1;border-left:0;border-top:1px solid #d8dee8}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>GameNpcFrame</h1>
    <span class="status" id="status">未连接</span>
    <span style="flex:1"></span>
    <span class="status">API</span>
    <input id="apiBase" value="http://localhost:8000">
    <button class="secondary" onclick="checkHealth()">检查</button>
  </header>

  <aside class="panel">
    <div class="section">
      <h2>文档导入</h2>
      <div class="field">
        <label>游戏设定 PDF</label>
        <div class="upload-row">
          <input id="gameSettingFile" type="file" accept="application/pdf">
          <button onclick="uploadPdf('game')">上传</button>
        </div>
      </div>
      <div class="field">
        <label>NPC 设定 PDF</label>
        <div class="upload-row">
          <input id="npcSettingFile" type="file" accept="application/pdf">
          <button class="success" onclick="uploadPdf('npc')">上传</button>
        </div>
      </div>
      <div class="result" id="uploadResult">等待上传设定文档。</div>
    </div>

    <div class="section">
      <h2>会话</h2>
      <div class="field">
        <label>玩家 ID</label>
        <input id="playerId" value="p001">
      </div>
      <div class="field">
        <label>昵称</label>
        <input id="nickname" value="测试玩家">
      </div>
      <div class="field">
        <label>会话 ID</label>
        <input id="sessionId" placeholder="留空自动生成">
      </div>
      <button onclick="enterScene()">进入默认场景</button>
    </div>

    <div class="section">
      <h2>NPC</h2>
      <button class="secondary" onclick="loadNpcs()">刷新 NPC</button>
      <div class="npc-list" id="npcList" style="margin-top:10px"></div>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-head">
      <b id="chatTitle">请选择 NPC</b>
      <span class="status" id="chatSub">游戏 NPC 对话调试</span>
    </div>
    <div class="messages" id="messages">
      <div class="msg system">
        上传设定后，NPC 对话会检索游戏设定片段作为 RAG 上下文。
      </div>
    </div>
    <div class="chat-input">
      <input
        id="messageInput"
        placeholder="输入玩家消息"
        onkeydown="if(event.key==='Enter')sendMessage()"
      >
      <button onclick="sendMessage()">发送</button>
    </div>
  </main>

  <aside class="panel right">
    <div class="tabs">
      <button class="tab active" onclick="switchTab(event,'rag')">RAG</button>
      <button class="tab" onclick="switchTab(event,'npc')">NPC</button>
      <button class="tab" onclick="switchTab(event,'raw')">原始</button>
    </div>
    <div class="tab-content active" id="tab-rag">
      <div class="field">
        <label>检索游戏设定</label>
        <textarea id="ragQuery" rows="4" placeholder="输入要检索的设定问题"></textarea>
      </div>
      <button onclick="searchRag()">检索</button>
      <div id="ragResult" style="margin-top:10px"></div>
    </div>
    <div class="tab-content" id="tab-npc">
      <div id="npcDetail" class="result">尚未选择 NPC。</div>
    </div>
    <div class="tab-content" id="tab-raw">
      <pre id="rawOutput">暂无数据</pre>
    </div>
  </aside>
</div>

<script>
const state = { sessionId: "", playerId: "", npcId: "", npcs: [] };
const $ = id => document.getElementById(id);
const api = () => $("apiBase").value.replace(/\/+$/, "");

function showSystem(text){addMessage("system", text)}
function setRaw(data){$("rawOutput").textContent=JSON.stringify(data,null,2)}
function clearMessages(){
  // 清空当前聊天窗口，供切换 NPC 或重载历史时使用。
  $("messages").innerHTML="";
}
function formatLatency(value){
  // 将后端保存的毫秒耗时格式化为聊天气泡中的短文本。
  const ms=Number(value);
  if(!Number.isFinite(ms))return "";
  return `耗时 ${(ms/1000).toFixed(2)} 秒`;
}
function setMessageLatency(el,latencyMs){
  // 在 NPC 气泡底部展示实际回复耗时，玩家和系统消息默认不展示。
  const text=formatLatency(latencyMs);
  if(!text)return;
  let meta=el.querySelector(".msg-meta");
  if(!meta){
    meta=document.createElement("div");
    meta.className="msg-meta";
    el.appendChild(meta);
  }
  meta.textContent=text;
}
function appendMessageText(el,text){
  // 流式接收片段时只追加正文，保留底部耗时区域。
  const content=el.querySelector(".msg-content") || el;
  content.textContent+=text;
  $("messages").scrollTop=$("messages").scrollHeight;
}
function addMessage(role,text,latencyMs=null){
  // 追加单条消息，并保持滚动条停留在最新消息。
  const el=document.createElement("div");
  el.className=`msg ${role}`;
  const content=document.createElement("div");
  content.className="msg-content";
  content.textContent=text;
  el.appendChild(content);
  setMessageLatency(el,latencyMs);
  $("messages").appendChild(el);
  $("messages").scrollTop=$("messages").scrollHeight;
  return el;
}
function roleToMessageClass(role){
  // 将后端角色枚举映射为前端气泡样式。
  const normalized=String(role || "").toLowerCase();
  if(normalized==="player")return "player";
  if(normalized==="npc" || normalized==="assistant")return "npc";
  return "system";
}
function renderMessages(messages){
  // 用历史消息重建聊天窗口，空历史时给出温和提示。
  clearMessages();
  if(!messages.length){
    showSystem("暂无历史消息，可以开始新的对话。");
    return;
  }
  messages.forEach(message=>{
    addMessage(
      roleToMessageClass(message.role),
      message.content || "",
      message.reply_latency_ms
    );
  });
}
function syncSessionStateFromInputs(){
  // 从输入框同步会话状态，避免页面刷新后内存状态为空。
  state.playerId=$("playerId").value.trim();
  state.sessionId=state.sessionId || $("sessionId").value.trim();
  return Boolean(state.playerId && state.sessionId);
}
async function jsonRequest(path, options={}){
  const res=await fetch(api()+path, options);
  const data=await res.json();
  if(!res.ok || !data.ok) throw new Error(data.error || data.detail || JSON.stringify(data));
  return data.data;
}
async function checkHealth(){
  try{
    const data=await jsonRequest("/health");
    $("status").textContent="已连接";
    setRaw(data);
  }catch(err){
    $("status").textContent="连接失败";
    showSystem(err.message);
  }
}
async function uploadPdf(type){
  const input=type==="game" ? $("gameSettingFile") : $("npcSettingFile");
  if(!input.files.length){alert("请选择 PDF 文件");return}
  const form=new FormData();
  form.append("file",input.files[0]);
  const path=type==="game" ? "/documents/game-settings/upload" : "/documents/npc-settings/upload";
  $("uploadResult").textContent="上传处理中...";
  try{
    const data=await jsonRequest(path,{method:"POST",body:form});
    $("uploadResult").textContent=JSON.stringify(data,null,2);
    setRaw(data);
    if(type==="npc") await loadNpcs();
  }catch(err){
    $("uploadResult").textContent=err.message;
  }
}
async function enterScene(){
  const player_id=$("playerId").value.trim();
  const nickname=$("nickname").value.trim();
  const session_id=$("sessionId").value.trim() || undefined;
  const data=await jsonRequest("/sessions",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({player_id,nickname,session_id})
  });
  state.playerId=player_id;
  state.sessionId=data.result?.session?.session_id || session_id;
  $("sessionId").value=state.sessionId || "";
  showSystem(`会话已创建：${state.sessionId}`);
  setRaw(data);
  await loadNpcs();
}
async function loadNpcs(){
  const data=await jsonRequest("/npcs");
  state.npcs=data.npcs || data.result?.npcs || [];
  $("npcList").innerHTML=state.npcs.map(n=>`
    <div class="npc-item ${state.npcId===n.npc_id?"active":""}" onclick="selectNpc('${n.npc_id}')">
      <div class="npc-row">
        <div>
          <div class="npc-name">${n.name || n.npc_id}</div>
          <div class="npc-role">${n.role || ""}</div>
        </div>
        <button class="danger" onclick="deleteNpc(event,'${n.npc_id}')">删除</button>
      </div>
    </div>
  `).join("") || "<div class='result'>暂无 NPC。</div>";
}
async function deleteNpc(event,npcId){
  event.stopPropagation();
  if(!confirm(`确认删除 NPC：${npcId}？`))return;
  try{
    const data=await jsonRequest(`/npcs/${npcId}`,{method:"DELETE"});
    if(state.npcId===npcId){
      state.npcId="";
      $("chatTitle").textContent="请选择 NPC";
      $("chatSub").textContent="游戏 NPC 对话调试";
      $("npcDetail").textContent="尚未选择 NPC。";
    }
    setRaw(data);
    await loadNpcs();
  }catch(err){
    showSystem(err.message);
  }
}
async function selectNpc(npcId){
  // 选择 NPC 后立即加载该玩家与 NPC 的历史对话。
  if(!syncSessionStateFromInputs()){alert("请先进入会话");return}
  try{
    await jsonRequest(`/sessions/${state.sessionId}/select-npc`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({npc_id:npcId})
    });
    state.npcId=npcId;
    const npc=state.npcs.find(n=>n.npc_id===npcId) || {};
    $("chatTitle").textContent=npc.name || npcId;
    $("chatSub").textContent=npc.role || "";
    $("npcDetail").textContent=JSON.stringify(npc,null,2);
    await loadDialogueHistory(npcId);
    await loadNpcs();
  }catch(err){
    showSystem(err.message);
  }
}
async function loadDialogueHistory(npcId){
  // 使用历史接口按玩家和 NPC 拉取对话，并渲染到聊天窗口。
  const params=new URLSearchParams({
    player_id:state.playerId,
    npc_id:npcId,
    limit:"80"
  });
  const data=await jsonRequest(`/dialogue/history?${params.toString()}`);
  const messages=data.messages || [];
  renderMessages(messages);
  setRaw(data);
}
async function sendMessage(){
  const text=$("messageInput").value.trim();
  if(!text)return;
  if(!syncSessionStateFromInputs() || !state.npcId){alert("请先进入会话并选择 NPC");return}
  $("messageInput").value="";
  addMessage("player",text);
  const npcEl=addMessage("npc","");
  try{
    const res=await fetch(api()+"/dialogue/messages/stream",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        player_id:state.playerId,
        session_id:state.sessionId,
        npc_id:state.npcId,
        message:text
      })
    });
    if(!res.ok || !res.body)throw new Error(`流式请求失败：${res.status}`);
    await readDialogueStream(res,npcEl);
  }catch(err){showSystem(err.message)}
}
async function readDialogueStream(res,npcEl){
  // 读取后端 SSE 流，把 chunk 追加到当前 NPC 气泡，done 时展示耗时。
  const reader=res.body.getReader();
  const decoder=new TextDecoder();
  let buffer="";
  while(true){
    const {value,done}=await reader.read();
    if(done)break;
    buffer+=decoder.decode(value,{stream:true});
    const parts=buffer.split("\n\n");
    buffer=parts.pop() || "";
    parts.forEach(part=>handleDialogueEvent(part,npcEl));
  }
  if(buffer.trim())handleDialogueEvent(buffer,npcEl);
}
function handleDialogueEvent(block,npcEl){
  // 解析单个 SSE 事件块，兼容多行 data 字段。
  const lines=block.split("\n");
  const eventLine=lines.find(line=>line.startsWith("event:"));
  const dataLines=lines.filter(line=>line.startsWith("data:"));
  const eventName=eventLine ? eventLine.slice(6).trim() : "message";
  const payloadText=dataLines.map(line=>line.slice(5).trim()).join("\n");
  if(!payloadText)return;
  const payload=JSON.parse(payloadText);
  if(eventName==="chunk"){
    appendMessageText(npcEl,payload.content || "");
    return;
  }
  if(eventName==="done"){
    setMessageLatency(npcEl,payload.reply_latency_ms);
    setRaw(payload);
    return;
  }
  if(eventName==="error"){
    throw new Error(payload.error || "流式响应失败");
  }
}
async function searchRag(){
  const query=$("ragQuery").value.trim();
  if(!query)return;
  const data=await jsonRequest("/rag/game-settings/search",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({query,limit:5})
  });
  $("ragResult").innerHTML=`
    <div class="data"><b>上下文</b><pre>${data.context || ""}</pre></div>
    <div class="data"><b>片段</b><pre>${JSON.stringify(data.chunks,null,2)}</pre></div>`;
  setRaw(data);
}
function switchTab(event,name){
  document.querySelectorAll(".tab").forEach(btn=>btn.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(tab=>tab.classList.remove("active"));
  event.target.classList.add("active");
  $(`tab-${name}`).classList.add("active");
}
checkHealth();
loadNpcs().catch(()=>{});
</script>
</body>
</html>
