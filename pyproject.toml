[project]
name = "coffee-npc-agent"
version = "0.1.0"
description = "面向游戏的咖啡厅 NPC Agent 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "openai>=1.0",
    "psycopg[binary]>=3.2",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
    "pgvector>=0.3.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coffee_npc_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
