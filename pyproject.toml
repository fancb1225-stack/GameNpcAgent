[project]
name = "game-npc-frame"
version = "0.1.0"
description = "面向游戏的通用 NPC Agent 框架后端"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "pypdf>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "requests>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
    "pgvector>=0.3.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "db", "model", "service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
